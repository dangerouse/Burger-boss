<meta charset="utf-8">
<title>Burger Boss</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">

<div id="shell">
  <header>
    <h1>Burger&nbsp;Boss</h1>
    <p class="tag">Collect every hot dog. Do not touch the grills.</p>
  </header>

  <div id="stage">
    <canvas id="game" width="960" height="540"></canvas>
    <a id="lb-link" href="#" target="_blank" rel="noopener" hidden>Submit to the public leaderboard &#8599;</a>

    <button id="fullscreen-btn" type="button" aria-label="Toggle fullscreen" title="Toggle fullscreen">&#9974;</button>

    <div id="touch-controls" aria-hidden="true">
      <div id="tc-move">
        <button type="button" class="tc-btn" data-code="ArrowLeft" aria-label="Move left">&larr;</button>
        <button type="button" class="tc-btn" data-code="ArrowRight" aria-label="Move right">&rarr;</button>
      </div>
      <button type="button" class="tc-btn tc-jump" data-code="Space" aria-label="Jump">&uarr;</button>
    </div>
  </div>

  <footer>
    <span><kbd>&larr;</kbd><kbd>&rarr;</kbd> / <kbd>A</kbd><kbd>D</kbd> move</span>
    <span><kbd>Space</kbd> / <kbd>W</kbd> / <kbd>&uarr;</kbd> jump</span>
    <span><kbd>R</kbd> restart level</span>
    <span><kbd>M</kbd> mute</span>
  </footer>
</div>

<script src="levels.js"></script>
<script src="game.js"></script>
<script src="leaderboard-link.js"></script>
<script src="mobile-controls.js"></script>
