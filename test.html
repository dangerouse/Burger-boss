  body { background:#141014; color:#e8e0d4; font:14px ui-monospace, Menlo, monospace; padding:18px; }

<script>
  /* Freeze the animation loop before the game starts so the test can drive
     frames one at a time with a fake clock. */
  window.__cb = null;
  window.requestAnimationFrame = cb => { window.__cb = cb; };
</script>
